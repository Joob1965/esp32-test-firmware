[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts =
    post:scripts/rename_firmware.py
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -DFEATURE_WEB_CONFIG=1
    -DFEATURE_GPIO=1
    -DFEATURE_SENSORS=1
    -DFEATURE_MQTT=1
    -DFEATURE_OTA=1

[env:esp32cam]
board = esp32cam
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=1
    -DGPIO_OUTPUT_1=-1
    -DGPIO_OUTPUT_2=-1
    -DSENSOR_ADC_PIN=-1

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DGPIO_OUTPUT_1=25
    -DGPIO_OUTPUT_2=26
    -DSENSOR_ADC_PIN=34

[env:shelly-plus-1]
board = esp32dev
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DCONFIG_FREERTOS_UNICORE=1
    -DFEATURE_CAMERA=0
    -DDEVICE_NAME_DEFAULT=\"Shelly-Plus-1\"
    -DGPIO_OUTPUT_1=26
    -DGPIO_OUTPUT_2=-1
    -DGPIO_SWITCH_INPUT=4
    -DGPIO_BUTTON_INPUT=25
    -DGPIO_STATUS_LED=0
    -DGPIO_STATUS_LED_INVERTED=1
    -DSENSOR_ADC_PIN=32
custom_firmware_name = Shelly_Plus_1.bin

[env:sonoff-dual-r3]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DDEVICE_NAME_DEFAULT=\"Sonoff-Dual-R3\"
    -DGPIO_OUTPUT_1=27
    -DGPIO_OUTPUT_2=14
    -DGPIO_BUTTON_INPUT=0
    -DGPIO_SWITCH_INPUT_1=32
    -DGPIO_SWITCH_INPUT_2=33
    -DGPIO_STATUS_LED=13
    -DGPIO_STATUS_LED_INVERTED=1
    -DSENSOR_ADC_PIN=-1
custom_firmware_name = Sonoff_Dual_R3.bin

[env:sonoff-dual-r3-lite]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DDEVICE_NAME_DEFAULT=\"Sonoff-Dual-R3-Lite\"
    -DGPIO_OUTPUT_1=27
    -DGPIO_OUTPUT_2=14
    -DGPIO_BUTTON_INPUT=0
    -DGPIO_SWITCH_INPUT_1=32
    -DGPIO_SWITCH_INPUT_2=33
    -DGPIO_STATUS_LED=13
    -DGPIO_STATUS_LED_INVERTED=1
    -DSENSOR_ADC_PIN=-1
custom_firmware_name = Sonoff_Dual_R3_Lite.bin

[env:shelly-plus-1-mini]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DDEVICE_NAME_DEFAULT=\"Shelly-Plus-1-Mini\"
    -DGPIO_OUTPUT_1=7
    -DGPIO_OUTPUT_2=-1
    -DGPIO_SWITCH_INPUT=10
    -DGPIO_BUTTON_INPUT=1
    -DGPIO_STATUS_LED=0
    -DGPIO_STATUS_LED_INVERTED=1
    -DSENSOR_ADC_PIN=3
custom_firmware_name = Shelly_Plus_1_Mini.bin

[env:shelly-plus-1pm-mini]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DDEVICE_NAME_DEFAULT=\"Shelly-Plus-1PM-Mini\"
    -DGPIO_OUTPUT_1=5
    -DGPIO_OUTPUT_2=-1
    -DGPIO_SWITCH_INPUT=10
    -DGPIO_STATUS_LED=-1
    -DSENSOR_ADC_PIN=3
custom_firmware_name = Shelly_Plus_1PM_Mini.bin

[env:esp32s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DGPIO_OUTPUT_1=15
    -DGPIO_OUTPUT_2=16
    -DSENSOR_ADC_PIN=1

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DGPIO_OUTPUT_1=4
    -DGPIO_OUTPUT_2=5
    -DSENSOR_ADC_PIN=1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DGPIO_OUTPUT_1=4
    -DGPIO_OUTPUT_2=5
    -DSENSOR_ADC_PIN=0

[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DFEATURE_CAMERA=0
    -DGPIO_OUTPUT_1=4
    -DGPIO_OUTPUT_2=5
    -DSENSOR_ADC_PIN=1

[env:esp32cam-debug]
extends = env:esp32cam
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup
